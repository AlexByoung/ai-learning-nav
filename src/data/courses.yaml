- id: cmu-dlsys
  title: "10-414/714 Deep Learning Systems: Algorithms and Implementation"
  provider: "Carnegie Mellon University"
  category: infra
  level: advanced
  prerequisites:
    - 熟练 Python，能读写 C++
    - 线性代数与机器学习基础
    - 了解 GPU / 并行计算更佳
  formats: [video, slides, assignments]
  free: true
  term: "Fall 2026"
  links:
    official: "https://dlsyscourse.org/"
    youtube: "https://www.youtube.com/@deeplearningsystemscourse1116"
    other: "https://dlsyscourse.org/lectures/"
  summary_zh: "从零写一个叫 Needle 的小型深度学习框架：自动微分、张量运算、GPU 加速，一直到常见模型结构都要自己实现。"
  why: "想做 AI Infra，亲手写一遍框架是理解 PyTorch 底下发生了什么的最直接方式。"
  verified_at: 2026-10-23

- id: mit-6-5940
  title: "MIT 6.5940 TinyML and Efficient AI Computing"
  provider: "MIT HAN Lab · Song Han"
  category: infra
