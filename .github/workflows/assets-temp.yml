# Temporary: search open collections from a runner with open network. Remove before merge.
name: assets-temp
on:
  push:
    branches: [claude/ai-learning-nav-dev-kg0cp5]
    paths: ['.taste-tools/queries.txt', '.taste-tools/collect.mjs', '.taste-tools/get.txt', '.github/workflows/assets-temp.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Search and preview
        run: node .taste-tools/collect.mjs
      - name: Download chosen pictures
        if: hashFiles('.taste-tools/get.txt') != ''
        run: |
          refs=$(grep -v '^#' .taste-tools/get.txt | awk -F'|' 'NF{gsub(/ /,"",$1);gsub(/ /,"",$2); print $1"|"$2}')
          for r in $refs; do
            ref="${r%%|*}"; name="${r##*|}"
            node .taste-tools/scripts/assets.mjs --get "$ref" --to public/archive --name "$name" --width 1920 || echo "FAILED $ref"
          done
          node .taste-tools/scripts/assets.mjs --credits --to public/archive || true
      - name: Self-host General Sans
        run: |
          mkdir -p src/assets/fonts
          css=$(curl -sS "https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700&display=swap")
          i=0
          for w in Regular Medium Bold; do
            url=$(echo "$css" | grep -o "//cdn.fontshare.com[^']*\.woff2" | sed -n "$((i+1))p")
            curl -sSfL "https:$url" -o "src/assets/fonts/GeneralSans-$w.woff2"
            i=$((i+1))
          done
          ls -la src/assets/fonts
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in .taste-tools/candidates src/assets/fonts public/archive; do if [ -e "$d" ]; then git add "$d"; fi; done
          git commit -m "Temporary: picture candidates and fonts from runner" || echo "nothing to commit"
          git push
